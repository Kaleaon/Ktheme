repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,E501,W503"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or:
          [javascript, jsx, ts, tsx, css, scss, json, yaml, markdown, html]
        exclude: ^(dist/|node_modules/|build/|\.gradle/|gradle/)

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: ^(src/|packages/).*\.(js|jsx|ts|tsx)$
        types: [file]
        exclude: ^(dist/|node_modules/|build/)
        additional_dependencies:
          - "eslint@8.57.0"
          - "@typescript-eslint/parser@7.0.0"
          - "@typescript-eslint/eslint-plugin@7.0.0"
          - "eslint-plugin-react-hooks@4.6.0"
          - "typescript@5.4.5"

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.28.0
    hooks:
      - id: check-jsonschema
        name: check-jsonschema (theme presets)
        files: ^(themes/examples/[^/]+\.json|themes/community/[^/]+\.json|docs/[^/]+\.json)$
        types: [json]
        args: ["--schemafile", "schemas/theme.schema.json"]

  - repo: local
    hooks:
      - id: ktheme-style-lint
        name: ktheme-style-lint
        entry: python3 scripts/ktheme-style-lint.py
        language: python
        types_or: [javascript, jsx, ts, tsx]
        exclude: ^(dist/|node_modules/|build/|schemas/|tests/|theme-creator/|tokens\.css|styles\.css|design-canvas\.jsx|src/themes/|src/core/|src/utils/|src/exporters/|src/redesign/|src/media/|src/cli/|src/adaptation/|src/effects/|src/linkpoint/|packages/react/src/(?!components/)|.*\.test\.(js|jsx|ts|tsx)$|__tests__/|tm-v.*\.jsx|preview-surface\.jsx|android-frame\.jsx|ds-docs\.jsx|tweaks-panel\.jsx)
