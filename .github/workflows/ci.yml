name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/reusable-validation.yml
    with:
      node-version: '22'

  build-kotlin:
    name: Build & Test Kotlin Modules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run Root Kotlin Unit Tests
        run: gradle test

      - name: Run Kotlin Plugin Unit Tests
        run: gradle test
        working-directory: kotlin-plugin

      - name: Build & Test Linkpoint Android App
        run: gradle assembleDebug testDebugUnitTest
        working-directory: apps/linkpoint-android

  build-swift:
    name: Build & Test Swift Package
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache SwiftPM Packages
        uses: actions/cache@v4
        with:
          path: libs/ktheme-swift/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('libs/ktheme-swift/Package.swift', 'libs/ktheme-swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Swift Package Tests
        run: swift test
        working-directory: libs/ktheme-swift

