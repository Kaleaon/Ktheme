name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Health & Catalog Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Task 1 - Lint codebase
        run: npm run lint

      - name: Task 2 - Run unit tests
        run: npm test

      - name: Task 3 - Build engine distribution
        run: npm run build

      - name: Task 4 - Verify README theme catalog parity
        run: npm run check:theme-catalog
